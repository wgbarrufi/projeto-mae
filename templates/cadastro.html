{% extends 'base.html' %}

{% block titulo %}
Cadastro
{% endblock %}

{% block conteudo %}

<div class="container-form">

    <h2>Criar Conta</h2>

    <form method="POST">

        <input type="text"
               name="nome"
               placeholder="Nome completo"
               required>

        <input type="email"
               name="email"
               placeholder="Email"
               required>

        <input type="text"
               name="cpf"
               placeholder="CPF"
               required>

        <input type="date"
               name="dataNascimento"
               required>

        <input type="text"
               name="login"
               placeholder="Login"
               required>

        <input type="password"
               name="senha"
               placeholder="Senha"
               required>

        <button type="submit">
            Criar Conta
        </button>

    </form>

</div>

{% endblock %}
