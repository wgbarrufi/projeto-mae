{% extends 'base.html' %}

{% block titulo %}
Login
{% endblock %}

{% block conteudo %}

<div class="form-container">

    <h1>Entrar</h1>

    <form method="POST">

        <input
            type="text"
            name="login"
            placeholder="Login"
            required
        >

        <input
            type="password"
            name="senha"
            placeholder="Senha"
            required
        >

        <button type="submit">
            Entrar
        </button>

    </form>

</div>

{% endblock %}
