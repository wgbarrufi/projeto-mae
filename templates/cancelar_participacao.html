{% extends 'base.html' %}

{% block titulo %}
Cancelar Participação
{% endblock %}

{% block conteudo %}

<div class="form-container">

    <h1>Cancelar Participação</h1>

    <p>
        Ao cancelar sua participação, sua conta ficará inativa
        e você não poderá mais acessar o sistema.
    </p>

    <form method="POST">

        <button type="submit">
            Confirmar cancelamento
        </button>

    </form>

</div>

{% endblock %}
